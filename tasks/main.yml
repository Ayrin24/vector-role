---
- name: Create group for Vector
  ansible.builtin.group:
    name: "{{ vector_group }}"
    state: present

- name: Create user for Vector
  ansible.builtin.user:
    name: "{{ vector_user }}"
    group: "{{ vector_group }}"
    system: true
    create_home: false

- name: Create download directory
  ansible.builtin.file:
    path: "{{ vector_download_dir }}"
    state: directory
    mode: "0755"

- name: Download Vector archive
  ansible.builtin.get_url:
    url: "https://packages.timber.io/vector/{{ vector_version }}/vector-{{ vector_version }}-{{ vector_arch }}.tar.gz"
    dest: "{{ vector_archive_path }}"
    mode: "0644"
  register: download_result

- name: Create installation directory
  ansible.builtin.file:
    path: "{{ vector_install_dir }}"
    state: directory
    owner: "{{ vector_user }}"
    group: "{{ vector_group }}"
    mode: "0755"

- name: Unarchive Vector
  ansible.builtin.unarchive:
    src: "{{ vector_archive_path }}"
    dest: "{{ vector_install_dir }}"
    remote_src: true
    extra_opts:
      - "--strip-components=2"
    owner: "{{ vector_user }}"
    group: "{{ vector_group }}"
  when: download_result.changed  # noqa no-handler

- name: Create symlink for vector binary
  ansible.builtin.file:
    src: "{{ vector_binary_path }}"
    dest: "/usr/local/bin/vector"
    state: link

- name: Create Vector configuration directory
  ansible.builtin.file:
    path: "{{ vector_config_dir }}"
    state: directory
    owner: "{{ vector_user }}"
    group: "{{ vector_group }}"
    mode: "0755"

- name: Deploy Vector configuration from template
  ansible.builtin.template:
    src: vector.yaml.j2
    dest: "{{ vector_config_path }}"
    owner: "{{ vector_user }}"
    group: "{{ vector_group }}"
    mode: "0644"
  notify: Restart Vector

- name: Create Vector data directory
  ansible.builtin.file:
    path: "{{ vector_data_dir }}"
    state: directory
    owner: "{{ vector_user }}"
    group: "{{ vector_group }}"
    mode: "0755"

- name: Deploy systemd unit for Vector
  ansible.builtin.template:
    src: vector.service.j2
    dest: /etc/systemd/system/vector.service
    mode: "0644"
  notify: Restart Vector

- name: Enable and start Vector
  ansible.builtin.systemd:
    name: "{{ vector_service_name }}"
    enabled: true
    state: started
    daemon_reload: true
# tasks file for vector
